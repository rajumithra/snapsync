# ==============================================================================
# SnapSync Multi-Service Production Stack
# Engineered for Sync AI Labs (https://syncailabs.in)
# ==============================================================================

version: '3.8'

services:
  # --- 1. PostgreSQL Production Database ---
  db:
    image: postgres:16-alpine
    container_name: snapsync-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snapsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SyncAILabs2026!}
      POSTGRES_DB: ${POSTGRES_DB:-snapsync_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapsync -d snapsync_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snapsync-network

  # --- 2. FastAPI Relay & Face AI Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snapsync-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: "SnapSync Live Photo Relay"
      ORGANIZATION: "Sync AI Labs"
      WEBSITE: "https://syncailabs.in"
      ENVIRONMENT: "production"
      DEBUG: "false"
      PORT: 8000
      SECRET_KEY: ${SECRET_KEY:-snapsync-production-jwt-syncailabs-secret-key-2026}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-snapsync}:${POSTGRES_PASSWORD:-SyncAILabs2026!}@db:5432/${POSTGRES_DB:-snapsync_db}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      PUBLIC_CDN_URL: ${PUBLIC_CDN_URL:-https://snapsync.syncailabs.in/static/uploads}
      CORS_ORIGINS: '["https://snapsync.syncailabs.in","http://localhost:3000","*"]'
    volumes:
      - uploads_data:/app/storage_uploads
    ports:
      - "8000:8000"
    networks:
      - snapsync-network

  # --- 3. Next.js Web Dashboard & Live Gallery ---
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: snapsync-web
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://backend:8000/ws}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://snapsync.syncailabs.in}
    ports:
      - "3000:3000"
    networks:
      - snapsync-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  snapsync-network:
    driver: bridge

